name: Actualizar datos y publicar

on:
  schedule:
    - cron: '17 3 * * *'   # cada noche a las 03:17 UTC (04:17/05:17 en Euskadi)
  workflow_dispatch:       # también a mano: pestaña Actions → "Run workflow"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Descargar datos oficiales
        if: github.event_name != 'push'
        run: node scripts/update.mjs

      - name: Guardar cambios en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/cambios.json
          git diff --cached --quiet || git commit -m "Actualización de datos $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
